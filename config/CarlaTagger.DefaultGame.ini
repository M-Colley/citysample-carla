[CarlaTagger]
; Semantic-segmentation labels are chosen from the asset's path. CARLA's built-in
; rule reads the folder after "Static", which only fits CARLA's own content
; layout; City Sample uses /Game/Building, /Game/Road/Kit_*, /Game/Prop/Kit_*,
; /Game/Vehicle/veh*, /Game/Crowd. A table seeded with City Sample's real
; taxonomy ships in Tagger.cpp (GCitySampleDefaultRules).
;
; Add or override rules here without recompiling. Longest prefix wins; a prefix
; that repeats a built-in replaces it. Label names are those accepted by
; ATagger::GetTagFromString (Buildings, Roads, RoadLines, Sidewalks, Poles,
; TrafficSigns, TrafficLight, Vegetation, Fences, Walls, Ground, Terrain, Water,
; Car, Truck, Bus, Bicycle, Motorcycle, Rider, Pedestrians, Static, Dynamic,
; Bridge, RailTrack, GuardRail, Sky, Rock, Other, None).
;
; Find candidates in the server log after a run:
;     grep "CarlaTagger: UNMATCHED" logs/run-carlacity.log | sort -u
;
; Example:
; +PathLabel=(Prefix="/Game/Prop/Kit_Scaffolding_RR", Label="Static")

; Set to False in a project that is not City Sample to drop the built-in table
; entirely instead of overriding its rules one by one.
bUseBuiltinCitySampleRules=True

; World Partition HLOD proxy meshes merge many semantic classes into one mesh,
; so any single label is wrong at every silhouette boundary. Skipped by default
; so the semantic camera falls through to the real streamed meshes behind them.
; Set True if your view is dominated by proxies and a coarse "Static" label is
; better than Unlabeled.
bTagHLODProxies=False
